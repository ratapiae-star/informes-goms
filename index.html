<script src="vendor/jspdf.umd.min.js"></script>
<script>
// JSZip's internal scheduler auto-detects the environment to decide how to yield between
// compression chunks (process.nextTick in Node, postMessage-to-self or MessageChannel in a
// browser). Providing setImmediate directly — before jszip.min.js loads — short-circuits
// that detection entirely, so the Excel Punch export never depends on which of those paths
// a given browser/webview happens to support well.
if (!window.setImmediate){
  window.setImmediate = function(fn){ return setTimeout(fn, 0); };
  window.clearImmediate = function(id){ clearTimeout(id); };
}
</script>
<script src="vendor/jszip.min.js"></script>
<script src="app.js"></script>
</body>
